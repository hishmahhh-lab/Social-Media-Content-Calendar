[project]
name = "social_media_content_calender"
version = "0.1.0"
description = "Social_Media_Content_Calender using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai-tools>=1.14.4",
    "crewai[tools]==1.14.4",
    "streamlit>=1.57.0",
]

[project.scripts]
social_media_content_calender = "social_media_content_calender.main:run"
run_crew = "social_media_content_calender.main:run"
train = "social_media_content_calender.main:train"
replay = "social_media_content_calender.main:replay"
test = "social_media_content_calender.main:test"
run_with_trigger = "social_media_content_calender.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
